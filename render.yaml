services:
  - type: web
    name: hand-cricket-bot
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: SUPER_ADMIN_ID
        sync: false
      - key: SUPER_ADMIN_USERNAME
        value: prathamesh63
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
