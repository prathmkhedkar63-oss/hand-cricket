version: '3.8'

services:
  bot-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hand_cricket_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - BOT_USERNAME=${BOT_USERNAME}
      - SUPER_ADMIN_ID=${SUPER_ADMIN_ID}
      - DEFAULT_GROUP_ID=${DEFAULT_GROUP_ID}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    volumes:
      - ./data:/app/data
    networks:
      - cricket_network

  nginx:
    image: nginx:alpine
    container_name: hand_cricket_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - bot-api
    networks:
      - cricket_network

networks:
  cricket_network:
    driver: bridge
